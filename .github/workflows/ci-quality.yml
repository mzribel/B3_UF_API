name: CI (Quality & Security)

on:
  push:
    branches: [ dev, prod, main ]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Code Quality (SpotBugs + Checkstyle)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Checkstyle
        run: mvn -B checkstyle:check
        continue-on-error: true   # ✅ ne bloque pas si erreurs de style

      - name: Run SpotBugs
        run: mvn -B spotbugs:check
        continue-on-error: true   # ✅ idem pour SpotBugs

      - name: Upload quality reports
        if: always()              # ✅ upload même si erreurs plus haut
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            **/target/checkstyle-result.xml
            **/target/spotbugsXml.xml
