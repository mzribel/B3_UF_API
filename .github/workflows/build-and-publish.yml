name: CI (dev) — Build • Tests • Rapports

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev, prod, main ]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests (Surefire + JaCoCo)
    runs-on: ubuntu-latest
    continue-on-error: true   # ✅ Ne bloque pas le pipeline

    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests
        run: mvn -B -DskipITs=true test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/*.xml

      - name: Publish JUnit summary (Surefire)
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: target/surefire-reports/*.xml
          check_name: "Surefire Tests"
          detailed_summary: true
          include_passed: true

      - name: Upload JaCoCo coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: |
            **/target/site/jacoco/*
            **/target/jacoco*.exec

  integration-tests:
    name: Integration tests (Failsafe)
    runs-on: ubuntu-latest
    needs: unit-tests

    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # On compile/package sans exécuter les tests
      - name: Build without tests
        run: mvn -B clean package -DskipTests

      - name: Run integration tests
        run: mvn -B failsafe:integration-test failsafe:verify

      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: target/failsafe-reports/*.xml

      - name: Publish JUnit summary (Failsafe)
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: target/failsafe-reports/*.xml
          check_name: "Failsafe Tests"
          detailed_summary: true
          include_passed: true

  package:
    name: Package JAR (artifact)
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package
        run: mvn -B -DskipTests package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: uf-api-jar
          path: target/*.jar

  deploy:
    name: Push Docker image to GHCR
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # nécessaire pour push vers GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository }}/uf-api:dev
          docker build -t $IMAGE_NAME .

      - name: Push Docker image
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository }}/uf-api:dev
          docker push $IMAGE_NAME
