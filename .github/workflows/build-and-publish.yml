name: CI (dev) — Build • Tests • Rapports

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  test:
    name: Maven tests (JUnit + JaCoCo)
    runs-on: ubuntu-latest
    
    permissions:
      checks: write     # nécessaire pour publier les checks (rapports JUnit, annotations)
      contents: read    # lecture du dépôt (obligatoire pour checkout, etc.)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & test (fail fast)
        run: mvn -B -DskipITs=false -Dmaven.test.failure.ignore=false clean verify

      - name: Upload surefire & failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml

      - name: Publish JUnit summary in PR
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          detailed_summary: true
          include_passed: true

      - name: Upload JaCoCo coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: |
            **/target/site/jacoco/*
            **/target/jacoco*.exec

  package:
    name: Package JAR (artifact)
    needs: [test]
    runs-on: ubuntu-latest
#    if: ${{ needs.test.result == 'success' }}
    if: always()

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package
        run: mvn -B -DskipTests package
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: uf-api-jar
          path: target/*.jar

